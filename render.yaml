# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Free plan: no disk, so work in /data is wiped whenever the service restarts
# or redeploys, and it sleeps after 15 idle minutes (first visit after that
# takes about a minute). To keep work, switch to plan: starter and add back
#   disk: { name: data, mountPath: /data, sizeGB: 1 }
# Frankfurt is the closest region to Iraq. No password: anyone with the link
# can open it. To add one later, set APP_PASSWORD in the Environment tab.
services:
  - type: web
    name: karbala-booklet
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    # Changes that only touch docs, tests, reference files or tools (and
    # their notes) do not rebuild or restart the live app.
    buildFilter:
      ignoredPaths:
        - docs/**
        - tests/**
        - references/**
        - tools/**
        - "**/*.md"
        - .claude/**
